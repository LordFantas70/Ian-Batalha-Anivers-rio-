<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benfica Zona Verde — Rua 5</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 20%, #e30613 0, #7d0008 30%, #050505 72%);
  font-family:Arial,sans-serif; color:#fff; padding:24px;
}
.card{
  width:min(520px,100%); text-align:center; padding:42px 25px;
  background:rgba(0,0,0,.78); border:2px solid #e30613; border-radius:22px;
  box-shadow:0 0 35px rgba(227,6,19,.45);
}
.eagle{font-size:68px;line-height:1}
h1{margin:14px 0 4px;font-size:32px;letter-spacing:1px}
.subtitle{color:#ddd;margin:0 0 28px;font-size:18px}
.location{
  background:#fff;color:#111;border-radius:14px;padding:20px;margin-bottom:25px;
  font-size:21px;font-weight:800;line-height:1.35;
}
.pin{font-size:34px;margin-bottom:8px}
.btn{
  display:block;padding:18px 20px;border-radius:12px;background:#e30613;color:#fff;
  text-decoration:none;font-size:21px;font-weight:900;
  box-shadow:0 5px 16px rgba(227,6,19,.5);
}
.small{margin-top:22px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<main class="card">
  <div class="eagle">🦅</div>
  <div style="font-size:22px;font-weight:800;margin:10px 0 4px;">Aniversário do Ian</div>
  <h1>BENFICA SEMPRE</h1>
  <p class="subtitle">SPORT LISBOA E BENFICA</p>
  <section class="location">
    <div class="pin">📍</div>
    Benfica Zona Verde<br>
    <span style="font-weight:600">Rua 05, Benfica Zona Verde</span>
  </section>
  <a class="btn" href="https://www.google.com/maps/search/?api=1&query=-8.9833256%2C13.1729497" target="_blank" rel="noopener">
    📍 VER LOCALIZAÇÃO NO MAPA
  </a>
  <div class="small">
  A casa fica no final da rua do Colégio Carpe Diem, do lado direito.
  <br><br>
  Toque no botão para abrir o local no Google Maps.
</div>
</main>
</body>
</html>
